[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/", "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
fs_permissions = [{ access = "read", path = "./.v3-proofs.json" }]

# Public QoreChain EVM endpoints. Use them by name:
#   forge script ... --rpc-url qorechain_testnet
[rpc_endpoints]
qorechain = "https://evm.qore.host"
qorechain_testnet = "https://evm-testnet.qore.host"

# Strict profile for the full verification pass (FOUNDRY_PROFILE=strict forge test):
# far more fuzz inputs and longer, deeper invariant campaigns than the everyday default
# (256 fuzz runs, 256 invariant runs x 500 calls). Same compiler settings as the deployment.
[profile.strict]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/", "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
fs_permissions = [{ access = "read", path = "./.v3-proofs.json" }]

[profile.strict.fuzz]
runs = 10000
max_test_rejects = 1000000

[profile.strict.invariant]
runs = 1000
depth = 200
fail_on_revert = false
